# nebiru.skylanex.com — Nebiru
#
# Deployed to /etc/nginx/conf.d/nebiru.skylanex.com.conf. Edit it HERE, copy it
# there, `nginx -t`, then `nginx -s reload` (`systemctl reload nginx` can fail
# 226/NAMESPACE on this box).
#
# Nothing is served from disk. The app is one container on 127.0.0.1:8787 (see
# nebiru.service) that serves both the web app and its API, so this file is a
# single proxy.
#
# TLS: issued for the bare subdomain through the shared webroot, as archis and
# altar are. The port-80 block must be live before certbot can answer:
#
#     certbot certonly --webroot -w /var/www/certbot -d nebiru.skylanex.com
#
# LOGIN: Nebiru has no accounts of its own, and anyone who reaches it can spend
# the DeepSeek balance and use the GPU. So the whole site sits behind HTTP basic
# auth. Users are lines in /etc/nginx/nebiru.htpasswd (root:nginx, 640); add one
# with:
#
#     printf '%s:%s\n' NAME "$(openssl passwd -apr1)" >> /etc/nginx/nebiru.htpasswd
#
# To open the site to everyone, delete the two auth_basic lines below.

server {
    listen 80;
    listen [::]:80;
    server_name nebiru.skylanex.com;

    # `^~` is load-bearing. nginx matches regex locations before plain prefix
    # ones, so the dotfile-deny block below would otherwise claim this path and
    # renewals would 403.
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / { return 301 https://nebiru.skylanex.com$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nebiru.skylanex.com;

    ssl_certificate /etc/letsencrypt/live/nebiru.skylanex.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nebiru.skylanex.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # A book is saved whole, in one request, and an imported one carries its
    # source text too.
    client_max_body_size 64m;

    auth_basic "Nebiru";
    auth_basic_user_file /etc/nginx/nebiru.htpasswd;

    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # One request writes a whole chapter or draws one picture. A chapter can
        # take a few minutes and a picture up to FLUX_TIMEOUT_SECONDS (600).
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    location ~ /\. { deny all; }
}

# Give ComfyUI the GPU through Docker's "nvidia" runtime instead of a device
# reservation.
#
# The device reservation in docker-compose.yml (the same thing as `docker run
# --gpus`) only works if the NVIDIA Container Toolkit was already installed when
# the Docker daemon last started. After installing the toolkit on a machine whose
# Docker cannot be restarted right now, register the runtime and reload instead:
#
#   nvidia-ctk runtime configure --runtime=docker
#   systemctl reload docker        # running containers are not touched
#
# then set in .env:
#
#   COMPOSE_FILE=docker-compose.yml:docker-compose.nvidia-runtime.yml
#
# This file keeps working after Docker is eventually restarted.

services:
  comfyui:
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    deploy: !reset null
